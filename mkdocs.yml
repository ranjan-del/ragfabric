# mkdocs.yml: the documentation site, built from docs/ as it is.
#   uv sync --group docs
#   uv run mkdocs serve            # http://127.0.0.1:8000, reloads on save
#   uv run mkdocs build --strict   # what CI runs; any broken link fails it
# Published to https://ragfabric.github.io by .github/workflows/docs.yml, on manual dispatch only.

site_name: RagFabric
site_description: Self hosted, measurement first retrieval augmented generation.
site_url: https://ragfabric.github.io/
repo_url: https://github.com/ranjan-del/ragfabric
repo_name: ranjan-del/ragfabric
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site

# Working documents stay in the repository, not on the site. README.md is the
# repository's index of docs/; index.md is the site's.
exclude_docs: |
  plans/
  design/
  /README.md

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Light mode

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

nav:
  - Home: index.md
  - Quick start: getting-started.md
  - Concepts:
      - Ingestion: concepts/ingestion.md
      - Embeddings: concepts/embeddings.md
      - Lexical and vector search: concepts/lexical-vs-vector.md
      - Reranking: concepts/reranking.md
      - Agentic loops: concepts/agentic-loops.md
      - Knowledge graphs: concepts/knowledge-graphs.md
      - Routing as classification: concepts/routing-as-classification.md
      - Access control: concepts/access-control.md
      - Trade-offs: trade-offs.md
      - Failure cases: failure-cases.md
      - Learning notes:
          - Lexical and semantic: learning/lexical-vs-semantic.md
          - First agentic run: learning/agentic-first-run.md
          - First graph extraction: learning/graph-extraction-first-run.md
          - First routing run: learning/routing-first-run.md
          - First hardening run: learning/hardening-first-run.md
          - First assistant run: learning/assistant-first-run.md
          - First evaluation run: learning/evaluation-first-run.md
  - Strategies:
      - Traditional: traditional-rag.md
      - Vectorless: vectorless-rag.md
      - Agentic: agentic-rag.md
      - Graph: graph-rag.md
      - Routing: routing.md
  - Assistant: assistant.md
  - Connectors: connectors.md
  - Deployment:
