[project]
name = "ragfabric-core"
version = "0.1.0a0"
description = "RagFabric engine: retrieval strategies, providers, stores, ingestion, evaluation, access policy."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "pydantic>=2.13",
  "pydantic-settings>=2.15",
  "sqlalchemy>=2.0.52",
  "alembic>=1.20",
  "psycopg[binary]>=3.3",
  "numpy>=2.3",
  "pypdf>=6.18",
  "python-docx>=1.2",
  "python-pptx>=1.0",
  "python-jose[cryptography]>=3.5",
  "bcrypt>=5.0",
  "email-validator>=2.3",
  "pyyaml>=6.0",
  "pgvector>=0.5",
  "redis>=8.1",
  "opentelemetry-sdk>=1.44",
  "opentelemetry-exporter-otlp-proto-http>=1.44",
  "tiktoken>=0.12",
]

[project.optional-dependencies]
chroma = ["chromadb>=1.5"]
# In-process BM25 (stores/bm25_memory.py). Optional because it is not the
# production path: the SQL store needs no extra at all, and a deployment
# that never uses the in-process store should not carry the dependency.
bm25 = ["rank_bm25>=0.2.2"]
rerank = ["sentence-transformers>=5.1"]
# Ollama also goes through OpenAICompatibleLLM/OpenAICompatibleEmbeddings
# (providers/openai_compat.py), since Ollama serves the OpenAI chat and
# embeddings API at /v1, so an Ollama-only deployment still needs this
# extra installed; only a deployment that uses neither OpenAI, Azure, vLLM,
# LM Studio nor Ollama can skip it.
openai = ["openai>=3.13"]
anthropic = ["anthropic>=1.5"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ragfabric_core"]
