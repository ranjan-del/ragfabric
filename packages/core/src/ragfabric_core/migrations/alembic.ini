# Alembic configuration.
#
# The database URL is deliberately NOT set here. env.py reads it from
# ragfabric_core.config.settings, which reads DATABASE_URL from the environment, so
# there is exactly one source of truth for where the database lives and no risk
# of a checked-in URL pointing a migration at the wrong server.

[alembic]
script_location = %(here)s
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
