name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes: { label: What happened, description: What you did, what you expected, what happened instead }
    validations: { required: true }
  - type: textarea
    id: repro
    attributes: { label: Steps to reproduce, description: Minimal steps, including the compose profile and providers configured }
    validations: { required: true }
  - type: input
    id: version
    attributes: { label: Version / commit }
  - type: textarea
    id: logs
    attributes: { label: Logs, render: shell }
