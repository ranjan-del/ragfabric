version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule: { interval: weekly }
    groups: { python-deps: { patterns: ["*"] } }
  - package-ecosystem: npm
    directory: /apps/assistant
    schedule: { interval: weekly }
    groups: { frontend-deps: { patterns: ["*"] } }
    ignore:
      - dependency-name: "@angular/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@angular-devkit/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # karma-jasmine 5.1 (latest release) only supports jasmine-core ^4.1.0 and
      # breaks at runtime under jasmine-core 7 (zone-testing patch fails with
      # "Cannot assign to read only property 'describe'"); hold both at 5.x
      # until a karma-jasmine release supports jasmine-core 7.
      - dependency-name: "jasmine-core"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/jasmine"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
