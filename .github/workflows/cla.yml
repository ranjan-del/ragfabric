name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: .github/cla/signatures.json
          path-to-document: https://github.com/ranjan-del/ragfabric/blob/main/CLA.md
          branch: cla-signatures
          allowlist: ranjan-del,dependabot[bot],dependabot-preview[bot]
          create-file-commit-message: 'chore: create CLA signature file'
          signed-commit-message: 'chore: $contributorName has signed the CLA in $owner/$repo#$pullRequestNo'
          custom-notsigned-prcomment: 'Thank you for the pull request. Before it can be reviewed, please read the [Contributor License Agreement](https://github.com/ranjan-del/ragfabric/blob/main/CLA.md) and sign it by posting the sentence below as a comment on this pull request.'
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-allsigned-prcomment: 'All contributors have signed the CLA. Thank you.'
          lock-pullrequest-aftermerge: false
