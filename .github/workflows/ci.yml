name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  UV_VERSION: "0.12.13"

jobs:
  lint:
    name: Lint (ruff, import-linter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check packages
      - run: uv run ruff format --check packages
      - run: uv run lint-imports

  backend:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      - name: Run tests
        env:
          JWT_SECRET: ci-test-secret
          DATABASE_URL: sqlite:///./ci.db
        run: uv run pytest -m "not integration"

  migrations:
    name: Migrations apply cleanly
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ragfabric
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      chroma:
        image: chromadb/chroma:1.5.9
        ports:
          - 8000:8000
        options: >-
          --health-cmd "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8000 && echo ok' || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      - name: upgrade head, downgrade base, upgrade head on PostgreSQL 18
        env:
          JWT_SECRET: ci-test-secret
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/ragfabric
        run: |
          uv run ragfabric db upgrade
          uv run ragfabric db downgrade
          uv run ragfabric db upgrade
      - name: Store integration tests on PostgreSQL 18 and Chroma
        env:
          JWT_SECRET: ci-test-secret
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/ragfabric
          RAGFABRIC_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/ragfabric
          RAGFABRIC_TEST_CHROMA_URL: http://localhost:8000
        run: |
          uv run pytest -m integration packages/core/tests/test_stores_postgres.py \
            packages/core/tests/test_stores_chroma.py -q

  frontend:
    name: Frontend build and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/assistant
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/assistant/package-lock.json
      - run: npm ci
      - name: Unit tests (headless Chrome)
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: npm test
      - run: npm run build
