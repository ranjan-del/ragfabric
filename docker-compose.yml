# docker-compose.yml
# Lite profile (default):   docker compose up --build
#   postgres (pgvector), redis, api, ui. Enough for Traditional and Vectorless RAG.
# Full profile:             docker compose --profile full up --build
#   adds chroma and neo4j for all four strategies. Does NOT start the worker.
# Workers profile:          docker compose --profile workers up --build
#   adds the worker; needed when ragfabric.yaml sets ingestion.indexing: queue.
#   The worker is not needed, and should not be started, on the default inline
#   config.
# Secrets and connection strings come from .env (copy .env.example).
#
# Ports are published on loopback (127.0.0.1) by default. To expose the stack on
# a network, change the bind address on the ports you need AND set
# ENVIRONMENT=production, a real JWT_SECRET, and your own FIRST_ADMIN_* in .env,
# because the development defaults seed admin@example.com.

name: ragfabric

services:
  postgres:
    # pgvector/pgvector:0.8.6-pg18 as of 2026-09-21
    image: pgvector/pgvector@sha256:2ba9ca5f2e7daa0f0e7723cba1ee9167bab54efd3640516a44ac1a928dd67e7a
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ragfabric}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ragfabric}
      POSTGRES_DB: ${POSTGRES_DB:-ragfabric}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ragfabric} -d ${POSTGRES_DB:-ragfabric}"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    # redis:8.8-alpine as of 2026-09-21
    image: redis@sha256:e2c307e77bcaf306fa9e468bda845165a46c4c015ffd238fb3c92ae5d71d486f
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build:
      context: .
      dockerfile: deploy/docker/api.Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ragfabric}:${POSTGRES_PASSWORD:-ragfabric}@postgres:5432/${POSTGRES_DB:-ragfabric}
      REDIS_URL: redis://redis:6379/0
      CHROMA_URL: http://chroma:8000
      NEO4J_URI: bolt://neo4j:7687
      CORS_ORIGINS: http://localhost:4200,http://localhost:80
      RAGFABRIC_CONFIG: /app/ragfabric.yaml
    volumes:
      - ./ragfabric.yaml:/app/ragfabric.yaml:ro
      - uploads:/app/data/uploads
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: deploy/docker/api.Dockerfile
    command: ["ragfabric", "worker"]
    profiles: ["workers"]
    healthcheck:
      disable: true
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ragfabric}:${POSTGRES_PASSWORD:-ragfabric}@postgres:5432/${POSTGRES_DB:-ragfabric}
      REDIS_URL: redis://redis:6379/0
      CHROMA_URL: http://chroma:8000
      RAGFABRIC_CONFIG: /app/ragfabric.yaml
    volumes:
      - ./ragfabric.yaml:/app/ragfabric.yaml:ro
      - uploads:/app/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped

  ui:
    build:
      context: .
      dockerfile: deploy/docker/ui.Dockerfile
    ports:
      - "127.0.0.1:4200:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
    depends_on:
      api:
        condition: service_healthy

  chroma:
    # chromadb/chroma:1.5.9 as of 2026-09-21
    image: chromadb/chroma@sha256:1e0b73a187a28757c572acba508c46f48c9e8b0acaf5c20e6d95cdedce1acdf6
    profiles: ["full"]
    environment:
      ANONYMIZED_TELEMETRY: "false"
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - chroma_data:/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8000 && echo ok' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12

  neo4j:
    # neo4j:2026.08.1-community as of 2026-09-21
    image: neo4j@sha256:d8f4c156caa3af76499134947deb11d13042e471d9733060449f2a01eb7a248e
    profiles: ["full"]
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-please-change-me-12}
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512M
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:7474 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18

volumes:
  postgres_data:
  redis_data:
  chroma_data:
  neo4j_data:
  uploads:
